<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clinic Closures & Abortion Rates</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
</head>
<body>
<div class="header">
  <h1>Where Clinics Close,<br/><em>Abortions Follow</em></h1>
  <hr class="rule"/>
</div>

<div class="legend">
  <div class="legend-item">
    <div class="legend-dot dot-clinic"></div>
    <span>% change in abortion clinics (2017–2020)</span>
  </div>
  <div class="legend-item">
    <div class="legend-dot dot-abortion"></div>
    <span>% change in abortion rate (2017–2020)</span>
  </div>
</div>

<div id="chart-container">
  <svg id="chart"></svg>
</div>

<p class="footnote">
  Source: Guttmacher Institute.
</p>

<script src="js/main.js"></script>
</body>
</html>
